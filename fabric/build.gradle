plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = project.mod_version
group = 'com.arc4io.archud'

base {
    archivesName = "archud-fabric-${project.minecraft_version}"
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    // API JEI (MIT) — только публичные интерфейсы, для плагинов модов, написанных для JEI
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
}

loom {
    mixin {
        defaultRefmapName = 'archud.refmap.json'
    }
    runs {
        client {
            programArgs "--width", "1920", "--height", "1080"
        }
    }
}

// Общий код Forge + Fabric
sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}

configurations {
    jeiApi
}

dependencies {
    // API JEI: компилируемся против него; в jar вкладывается отдельным модом «jei» (только API)
    compileOnly "mezz.jei:jei-1.20.1-common-api:${project.jei_version}"
    jeiApi("mezz.jei:jei-1.20.1-common-api:${project.jei_version}") { transitive = false }
    jeiApi("mezz.jei:jei-1.20.1-fabric-api:${project.jei_version}") { transitive = false }
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Официальные маппинги Mojang — те же имена классов, что и в Forge, поэтому общий код один
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // CIT Resewn (MIT, SHsuperCM) — CIT-ресурспаки OptiFine; встроен в jar Arc HUD
    include(modImplementation("maven.modrinth:cit-resewn:1.1.3+1.20"))
    // в тестовом запуске Loom не распаковывает вложенный jar с типами CIT — подключаем его явно (в релиз не попадает)
    modLocalRuntime "maven.modrinth:cit-resewn-defaults:1.1.3+1.20"

    // e4mc (MIT, skye) — «Открыть для сети» доступно из интернета; встроен в jar Arc HUD
    include "maven.modrinth:e4mc:6.2.3-fabric"

    // только для тестового запуска: проверка своего экрана графики с Sodium
    modLocalRuntime "maven.modrinth:sodium:mc1.20.1-0.5.11"

    // Необязательные: Trinkets (слоты спины/пояса), Mod Menu (кнопка настроек)
    modCompileOnly "dev.emi:trinkets:${project.trinkets_version}"
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

// API JEI отдельным модом «jei»: классы API + fabric.mod.json и лицензия MIT, переведённые в intermediary
def jeiApiJar = tasks.register('jeiApiJar', Jar) {
    archiveFileName = 'jei-api-archud-fabric-dev.jar'
    destinationDirectory = layout.buildDirectory.dir('jei-api')
    from({ configurations.jeiApi.resolve().collect { zipTree(it) } }) {
        exclude 'META-INF/**', 'fabric.mod.json', 'pack.mcmeta', '*.png', '*.mixins.json', '*refmap*'
    }
    from(file('jei-api'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
def jeiApiRemap = tasks.register('jeiApiRemapJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn jeiApiJar
    inputFile = jeiApiJar.flatMap { it.archiveFile }
    archiveFileName = 'jei-api-archud-fabric.jar'
    destinationDirectory = layout.buildDirectory.dir('jei-api-remapped')
    addNestedDependencies = false
}
// вложить его в готовый jar (META-INF/jars + список jars в fabric.mod.json)
def injectJeiApi = tasks.register('injectJeiApi') {
    dependsOn 'remapJar', jeiApiRemap
    doLast {
        def jar = tasks.named('remapJar').get().archiveFile.get().asFile
        def api = jeiApiRemap.get().archiveFile.get().asFile
        def text = null
        new java.util.zip.ZipFile(jar).withCloseable { z -> text = z.getInputStream(z.getEntry('fabric.mod.json')).getText('UTF-8') }
        def json = new groovy.json.JsonSlurper().parseText(text)
        def jars = (json.jars ?: []) as List
        def path = "META-INF/jars/${api.name}"
        if (!jars.any { it.file == path }) jars << [file: path]
        json.jars = jars
        def tmp = new File(buildDir, 'jei-inject')
        tmp.deleteDir()
        tmp.mkdirs()
        def meta = new File(tmp, 'fabric.mod.json')
        meta.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
        def out = new File(jar.parentFile, jar.name + '.tmp')
        ant.zip(destfile: out) {
            zipfileset(src: jar) { exclude(name: 'fabric.mod.json'); exclude(name: path) }
            zipfileset(file: meta, fullpath: 'fabric.mod.json')
            zipfileset(file: api, fullpath: path)
        }
        jar.delete()
        out.renameTo(jar)
    }
}
tasks.named('remapJar') { finalizedBy injectJeiApi }
tasks.named('build') { dependsOn injectJeiApi }

// Серверный jar: тот же мод без клиентских ресурсов (встроенный ресурспак «Родное слово», текстуры, шейдеры,
// звуки) и без вложенных клиентских модов (CIT Resewn, e4mc) — для выделенного сервера Fabric 1.20.1.
def serverMeta = tasks.register('serverMeta') {
    dependsOn 'remapJar', injectJeiApi
    def out = layout.buildDirectory.file('server-meta/fabric.mod.json')
    outputs.file out
    doLast {
        def jar = tasks.named('remapJar').get().archiveFile.get().asFile
        def text = null
        new java.util.zip.ZipFile(jar).withCloseable { z -> text = z.getInputStream(z.getEntry('fabric.mod.json')).getText('UTF-8') }
        def json = new groovy.json.JsonSlurper().parseText(text)
        json.remove('jars')
        json.description = (json.description ?: '') + ' (server build)'
        def f = out.get().asFile
        f.parentFile.mkdirs()
        f.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
    }
}
def serverJar = tasks.register('serverJar', Zip) {
    dependsOn serverMeta
    archiveFileName = "archud-server-fabric-${project.minecraft_version}-${project.mod_version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from({ zipTree(tasks.named('remapJar').get().archiveFile.get().asFile) }) {
        exclude 'resourcepacks/**', 'META-INF/jars/**', 'fabric.mod.json'
        exclude { e -> e.path.startsWith('assets/') && e.path != 'assets/archud/icon.png' && !e.directory }
    }
    from(layout.buildDirectory.dir('server-meta'))
}
tasks.named('build') { dependsOn serverJar }
