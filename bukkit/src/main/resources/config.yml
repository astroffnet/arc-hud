# Arc HUD — серверная часть (Bukkit / Spigot / Paper)
# Общая карта: игроки с Arc HUD присылают исследованную местность, сервер хранит её и раздаёт всем
map-sync: true
# Позиции игроков на мини-карте и карте мира (скрывшие себя и невидимые не показываются)
player-positions: true
# Поделиться меткой с игроками
waypoint-sharing: true
# Хранить метки каждого игрока (по нику с учётом регистра) и отдавать их при входе
waypoint-sync: true
# AntiESP: не показывать игрокам сущности, скрытые за непрозрачными блоками (нужен Spigot/Paper 1.18+)
anti-esp: true
# Радиус, в котором AntiESP проверяет сущности (блоков)
anti-esp-range: 64
