plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = 'com.arc4io.archud'

base {
    archivesName = "archud-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // миксины других модов (в тесте совместимости) — их refmap переводится на имена среды разработки
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--width', '1920', '--height', '1080'
            mods { archud { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            mods { archud { source sourceSets.main } }
        }
    }
}

// Общий код Forge + Fabric
sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}

// Миксины (выбор рецепта при конфликте, новый вид чата)
mixin {
    add sourceSets.main, 'archud.refmap.json'
    config 'archud.forge.mixins.json'
}

repositories {
    // Modrinth — только для группы maven.modrinth; хранилище ForgeGradle (fg.repository) тоже допускается,
    // туда кладутся пересобранные под среду разработки моды (fg.deobf)
    exclusiveContent {
        forRepositories(maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
        }, fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepositories(maven {
            name = 'CurseMaven'
            url = 'https://cursemaven.com'
        }, fg.repository)
        filter { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
}

configurations {
    bundled
}

dependencies {
    // e4mc (MIT, skye) — «Открыть для сети» доступно из интернета; кладётся в jar как вложенный мод (Jar-in-Jar)
    bundled("maven.modrinth:e4mc:6.2.3-forge") { transitive = false }
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Тест совместимости (CI: -PcompatMods): моды игрока из Modrinth (по id версии — номера версий у Forge и Fabric совпадают)
    if (project.hasProperty('compatMods')) {
        runtimeOnly fg.deobf("maven.modrinth:aether:2411kUqF")
        runtimeOnly fg.deobf("maven.modrinth:azurelib:BF48e0nr")
        runtimeOnly fg.deobf("maven.modrinth:azurelib-armor:ZzJnDHAP")
        runtimeOnly fg.deobf("maven.modrinth:playeranimator:xe2EVE6q")
        runtimeOnly fg.deobf("maven.modrinth:regeneration:OIui6HZO")
        runtimeOnly fg.deobf("maven.modrinth:legends-mod-core:nCsrAjfS")
        // библиотеки, которые Legends несёт внутри себя (jar-in-jar не деобфусцируется в dev-запуске)
        runtimeOnly fg.deobf("curse.maven:photon-871522:7501597")
        runtimeOnly fg.deobf("maven.modrinth:ldlib:ONxYJpRz")
    }

    // Curios — необязательная зависимость (слоты спины/пояса/амулетов)
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_version: mod_version, minecraft_version: minecraft_version]
    inputs.properties props
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'archud',
                'Specification-Vendor'    : 'arc4io',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'arc4io',
                'MixinConfigs'            : 'archud.forge.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Jar-in-Jar: вложить e4mc в итоговый jar (META-INF/jarjar + metadata.json) после reobf
def bundleJarJar = tasks.register('bundleJarJar') {
    dependsOn 'reobfJar'
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def deps = configurations.bundled.resolve()
        def tmpDir = new File(buildDir, 'jarjar-tmp')
        tmpDir.deleteDir()
        tmpDir.mkdirs()
        def entries = []
        deps.each { f ->
            entries << """{"identifier":{"group":"maven.modrinth","artifact":"e4mc"},"version":{"range":"[6.2.3-forge,)","artifactVersion":"6.2.3-forge"},"path":"META-INF/jarjar/${f.name}","isObfuscated":false}"""
        }
        def meta = new File(tmpDir, 'metadata.json')
        meta.text = '{"jars":[' + entries.join(',') + ']}'
        def out = new File(jarFile.parentFile, jarFile.name + '.tmp')
        ant.zip(destfile: out) {
            zipfileset(src: jarFile)
            deps.each { f -> zipfileset(file: f, prefix: 'META-INF/jarjar') }
            zipfileset(file: meta, fullpath: 'META-INF/jarjar/metadata.json')
        }
        jarFile.delete()
        out.renameTo(jarFile)
    }
}
tasks.matching { it.name == 'reobfJar' }.configureEach { finalizedBy bundleJarJar }
tasks.named('build') { dependsOn bundleJarJar }

// Серверный jar: тот же мод без клиентских ресурсов (встроенный ресурспак «Родное слово», текстуры, шейдеры,
// звуки) и без e4mc — для выделенного сервера Forge / NeoForge 1.20.1.
def serverJar = tasks.register('serverJar', Zip) {
    dependsOn bundleJarJar
    archiveFileName = "archud-server-forge-${minecraft_version}-${mod_version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'resourcepacks/**', 'assets/**', 'META-INF/jarjar/**'
    }
}
tasks.named('build') { dependsOn serverJar }
