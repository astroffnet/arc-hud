name: Server test (dedicated servers)

# Запускает настоящие серверы с серверной частью Arc HUD и проверяет, что они стартуют без ошибок:
#  Forge 1.20.1 + archud-server-forge, Fabric 1.20.1 + archud-server-fabric, Paper 1.20.1 / 1.21.1 + плагин.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: forge
            project: forge
            java: 17
          - name: fabric
            project: fabric
            java: 17
          # полный jar + настоящий JEI: должен загрузиться JEI, а не вложенный в Arc HUD API «jei»
          - name: forge-jei
            project: forge
            java: 17
          - name: forge-full
            project: forge
            java: 17
          - name: fabric-jei
            project: fabric
            java: 17
          - name: paper-1.20.1
            project: bukkit
            java: 17
            mc: 1.20.1
          - name: paper-1.21.1
            project: bukkit
            java: 21
            mc: 1.21.1
    name: Server (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 for the build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: gradle build --no-daemon -q

      - name: JDK ${{ matrix.java }} for the server
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Prepare server
        run: |
          set -e
          mkdir -p /tmp/srv && cd /tmp/srv
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nspawn-protection=0\nview-distance=4\n' > server.properties
          case "${{ matrix.name }}" in
            forge|forge-jei|forge-full)
              FV=$(grep '^forge_version' $GITHUB_WORKSPACE/forge/gradle.properties | cut -d= -f2)
              curl -sSLo installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-$FV/forge-1.20.1-$FV-installer.jar"
              java -jar installer.jar --installServer > install.log 2>&1
              mkdir -p mods
              if [ "${{ matrix.name }}" = forge ]; then cp $GITHUB_WORKSPACE/forge/build/libs/archud-server-forge-*.jar mods/
              else cp $(ls $GITHUB_WORKSPACE/forge/build/libs/archud-forge-*.jar | grep -v -e sources -e server) mods/; fi
              if [ "${{ matrix.name }}" = forge-jei ]; then curl -sSLo mods/jei.jar "https://cdn.modrinth.com/data/u6dRKJwZ/versions/SOmd9h8c/jei-1.20.1-forge-15.74.0.230.jar"; fi
              echo 'bash run.sh nogui' > start.sh ;;
            fabric|fabric-jei)
              LV=$(grep '^loader_version' $GITHUB_WORKSPACE/fabric/gradle.properties | cut -d= -f2)
              FA=$(grep '^fabric_version' $GITHUB_WORKSPACE/fabric/gradle.properties | cut -d= -f2)
              curl -sSLo server.jar "https://meta.fabricmc.net/v2/versions/loader/1.20.1/$LV/1.0.1/server/jar"
              mkdir -p mods
              if [ "${{ matrix.name }}" = fabric-jei ]; then
                # JEI для Fabric требует свежие загрузчик и Fabric API
                LV=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
                curl -sSLo server.jar "https://meta.fabricmc.net/v2/versions/loader/1.20.1/$LV/1.0.1/server/jar"
              fi
              mkdir -p mods
              if [ "${{ matrix.name }}" = fabric-jei ]; then curl -sSLo mods/fabric-api.jar "https://cdn.modrinth.com/data/P7dR8mSH/versions/rvI2dfzR/fabric-api-0.92.12%2B1.20.1.jar"
              else curl -sSLo mods/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$FA/fabric-api-$FA.jar"; fi
              if [ "${{ matrix.name }}" = fabric ]; then cp $GITHUB_WORKSPACE/fabric/build/libs/archud-server-fabric-*.jar mods/
              else
                cp $(ls $GITHUB_WORKSPACE/fabric/build/libs/archud-fabric-*.jar | grep -v -e sources -e server) mods/
                curl -sSLo mods/jei.jar "https://cdn.modrinth.com/data/u6dRKJwZ/versions/NKdcms4C/jei-1.20.1-fabric-15.74.0.230.jar"
              fi
              echo 'java -Xmx2G -jar server.jar nogui' > start.sh ;;
            paper-*)
              URL=$(curl -s "https://fill.papermc.io/v3/projects/paper/versions/${{ matrix.mc }}/builds/latest" | jq -r '.downloads."server:default".url')
              echo "Paper: $URL"
              curl -sSLo paper.jar -H "User-Agent: arc-hud-ci (github.com/astroffnet/arc-hud)" "$URL"
              mkdir -p plugins && cp $GITHUB_WORKSPACE/bukkit/build/libs/archud-server-bukkit-*.jar plugins/
              echo 'java -Xmx2G -jar paper.jar nogui' > start.sh ;;
          esac
          ls -la mods plugins 2>/dev/null || true

      - name: Run server until "Done", then stop
        run: |
          cd /tmp/srv
          ( for i in $(seq 1 300); do grep -q 'Done (' logs/latest.log 2>/dev/null && break; sleep 2; done; sleep 20; echo stop ) \
            | timeout 900 bash start.sh > console.log 2>&1 || true
          cp logs/latest.log server.log 2>/dev/null || cp console.log server.log
          if grep -q 'Done (' server.log; then STATUS=success; else STATUS=failure; fi
          # ошибки Arc HUD: миксины, исключения, отключение плагина
          grep -n -i -E "archud|arc hud" server.log | grep -i -E "error|exception|fail|could not|disabl" | grep -v -E "Disabling ArcHUD|\] \[ArcHUD\] Disabling" > archud-errors.txt || true
          if [ -s archud-errors.txt ]; then STATUS=failure; fi
          grep -n -i -E "archud|arc hud|jei" server.log | head -60 > archud-lines.txt || true
          echo "$GITHUB_SHA $STATUS" > STATUS.txt
          echo "STATUS=$STATUS" >> $GITHUB_ENV
          cat STATUS.txt archud-lines.txt archud-errors.txt

      - name: Publish logs
        if: always()
        run: |
          mkdir -p /tmp/out && cd /tmp/srv
          cp STATUS.txt server.log console.log archud-lines.txt archud-errors.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b ci-server-${{ matrix.name }}
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Server test ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-server-${{ matrix.name }}

      - name: Fail if the server did not start cleanly
        if: env.STATUS != 'success'
        run: exit 1
