name: E2E (client mod <-> Paper + plugin)

# Клиент Arc HUD (Fabric и Forge) подключается к серверу Paper 1.20.1 с плагином Arc HUD:
# приветствие, синхронизация меток, админ-панель, действие из неё. Логи и скриншоты — в ветку ci-e2e-<loader>.
on:
  push:
    paths: [ ".github/e2e.txt" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, forge ]
    name: E2E (${{ matrix.loader }} client + Paper)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils jq

      - name: Build plugin
        working-directory: bukkit
        run: gradle build --no-daemon -q

      - name: Start Paper 1.20.1 with the plugin
        run: |
          set -e
          mkdir -p /tmp/srv/plugins && cd /tmp/srv
          URL=$(curl -s "https://fill.papermc.io/v3/projects/paper/versions/1.20.1/builds/latest" | jq -r '.downloads."server:default".url')
          curl -sSLo paper.jar -H "User-Agent: arc-hud-ci (github.com/astroffnet/arc-hud)" "$URL"
          cp $GITHUB_WORKSPACE/bukkit/build/libs/archud-server-bukkit-*.jar plugins/
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nspawn-protection=0\nview-distance=6\nenforce-secure-profile=false\n' > server.properties
          mkfifo /tmp/srv/in
          # держим FIFO открытым, чтобы сервер не получил EOF
          (sleep 100000 > /tmp/srv/in) &
          nohup java -Xmx2G -jar paper.jar nogui < /tmp/srv/in > console.log 2>&1 &
          for i in $(seq 1 240); do grep -q 'Done (' logs/latest.log 2>/dev/null && break; sleep 2; done
          grep 'Done (' logs/latest.log
          # как только клиент зайдёт — сделать его оператором (для админ-панели)
          ( for i in $(seq 1 600); do grep -q 'joined the game' logs/latest.log && break; sleep 1; done; sleep 2; echo "op @a" > /tmp/srv/in ) &

      - name: Run client and connect
        working-directory: ${{ matrix.loader }}
        env:
          ARCHUD_SHOWCASE: "1"
          ARCHUD_E2E: "127.0.0.1:25565"
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
        run: |
          set +e
          timeout 25m xvfb-run -a -s "-screen 0 1920x1080x24" gradle runClient --no-daemon --stacktrace > runclient.log 2>&1
          echo "exit code: $?" >> runclient.log
          exit 0

      - name: Stop server and collect
        if: always()
        run: |
          echo "stop" > /tmp/srv/in || true
          sleep 15
          mkdir -p /tmp/out
          cp /tmp/srv/logs/latest.log /tmp/out/server.log 2>/dev/null || true
          (cd /tmp/srv/plugins && find ArcHUD -type f | sort) > /tmp/out/plugin-files.txt 2>/dev/null || true
          cp ${{ matrix.loader }}/run/logs/latest.log /tmp/out/client.log 2>/dev/null || true
          cp ${{ matrix.loader }}/runclient.log /tmp/out/ 2>/dev/null || true
          cp ${{ matrix.loader }}/run/screenshots/e2e_*.png /tmp/out/ 2>/dev/null || true
          grep -a "\[E2E\]" /tmp/out/client.log > /tmp/out/e2e.txt || true
          grep -a -i "archud\|arc hud" /tmp/out/server.log >> /tmp/out/e2e.txt || true
          cat /tmp/out/plugin-files.txt >> /tmp/out/e2e.txt || true
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/out/STATUS.txt
          cat /tmp/out/e2e.txt
          cd /tmp/out
          git init -q -b ci-e2e-${{ matrix.loader }}
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "E2E ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-e2e-${{ matrix.loader }}
