name: Build Arc HUD

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        loader: [ forge, fabric ]
    name: Build (${{ matrix.loader }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build ${{ matrix.loader }}
        working-directory: ${{ matrix.loader }}
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      # Кладёт jar и лог сборки в ветку ci-<loader> (удобно забирать без входа в Actions)
      - name: Publish build output to branch
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/out
          cp ${{ matrix.loader }}/build.log /tmp/out/ 2>/dev/null || true
          find ${{ matrix.loader }}/build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} /tmp/out/ \; 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/out/STATUS.txt
          cd /tmp/out
          git init -q -b ci-${{ matrix.loader }}
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-${{ matrix.loader }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: archud-${{ matrix.loader }}-1.20.1
          path: |
            ${{ matrix.loader }}/build/libs/*.jar
            !${{ matrix.loader }}/build/libs/*-sources.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
